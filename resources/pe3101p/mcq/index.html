<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PE3101P MCQ practice — Tomi Francis</title>
  <meta name="description" content="Multiple-choice practice for PE3101P: Decision and Social Choice.">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="practice.css">
  <script src="vendor/katex/katex.min.js" defer></script>
  <script type="module" src="practice.mjs"></script>
</head>
<body>
  <nav aria-label="Main navigation"><a href="../../../index.html">Home</a><a href="../../../pe3101p.html">Decision and Social Choice</a><a href="../../../teaching.html">Teaching</a><a href="../../../cv.html">CV</a><a href="../../../about.html">About me</a></nav>
  <main>
    <header><div><p class="eyebrow">PE3101P · Decision and Social Choice</p><h1>MCQ practice</h1></div><a class="course-link" href="../../../pe3101p.html">Course materials</a></header>
    <section class="toolbar" aria-label="Practice controls">
      <label for="week">Week <select id="week"><option value="all">All available weeks</option></select></label>
      <div class="navigation"><button id="previous" type="button" disabled>Previous</button><button id="variant" type="button">New version</button><button id="next" type="button">Next question →</button></div>
    </section>
    <div id="status" role="status" aria-live="polite">Loading questions…</div>
    <section id="practice" class="practice" hidden>
      <aside id="model" class="model" hidden aria-label="Shared decision problem"><div id="context"></div><div id="tree" class="tree"></div><div id="model-table"></div></aside>
      <article class="question">
        <p id="question-meta" class="eyebrow"></p>
        <div id="stem" class="stem"></div>
        <div id="question-table"></div>
        <fieldset id="answers" aria-labelledby="stem"><legend class="sr-only">Choose one answer</legend></fieldset>
        <button id="check" class="primary" type="button" disabled>Check answer</button>
        <section id="feedback" class="feedback" hidden aria-live="polite"><strong id="verdict"></strong><div id="explanation"></div></section>
      </article>
    </section>
    <noscript>This practice page needs JavaScript to generate questions and check answers.</noscript>
  </main>
</body>
</html>
